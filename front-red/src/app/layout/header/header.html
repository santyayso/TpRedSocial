<header class="navbar">
<div class="brand">
    <img src="favicon.png" alt="Logo de Red social" class="logo-header">
    <h1>Red social</h1>
</div>

  <nav class="nav-links">
    <a routerLink="/publicaciones" routerLinkActive="active">Publicaciones</a>
    <a routerLink="/mi-perfil" routerLinkActive="active">Mi perfil</a>
    @if (authService.currentUser()) {
      <button type="button" (click)="logout()">Cerrar sesión</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Iniciar sesión</a>
      <a routerLink="/register" routerLinkActive="active">Registrarse</a>
    }
  </nav>
</header>
