<!-- si clickeamos en el fondo se cierra -->
<div class="modal-fondo" (click)="cerrarModal.emit()">
   <!-- frenamos la propagacion para que no se cierre al hacer click dentro de la ventana -->
  <div class="modal" (click)="$event.stopPropagation()">
    <header class="modal-header">
      <h3>{{ titulo() }}</h3>
                                                    <!-- emitimos evento al padre -->
      <button type="button" class="modal-cerrar" (click)="cerrarModal.emit()">×</button>
    </header>
  
    <div class="modal-cuerpo">
      <!-- aca va todo lo que se puso entre las etiquetas cuando llamamos al app-modal-->
      <ng-content />
    </div>
  </div>
</div>
